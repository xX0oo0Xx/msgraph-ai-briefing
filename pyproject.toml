[project]
name = "msgraph-ai-briefing"
version = "0.1.0"
description = "AI daily briefing agent over Microsoft Graph mail and calendar"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
